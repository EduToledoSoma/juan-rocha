name: juan_rocha_boxe
description: Gestão local do CT Juan Rocha Boxe para Android, iOS, Linux e Windows.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  share_plus: ^12.0.2
  pdf: ^3.12.0
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_original.jpg

flutter_launcher_icons:
  ios: true
  android: true
  image_path: 'assets/brand/icone_ios.png'
  remove_alpha_ios: true
